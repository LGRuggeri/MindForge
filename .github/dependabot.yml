# Atualizações automáticas de dependências.
# Alertas e PRs de segurança são configurados em Settings → Advanced Security;
# este arquivo cuida das atualizações periódicas de versão.
version: 2

updates:
  - package-ecosystem: npm
    directory: /mindforge-api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Os pacotes do NestJS só funcionam na mesma major: sobem juntos, em um PR só.
      nestjs:
        patterns: ["@nestjs/*"]
      # Minors e patches viram um PR só; majors continuam em PRs separados.
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      # Majors de TypeScript e ESLint são migrados à mão, quando fizer sentido.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /mindforge-web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-e-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
